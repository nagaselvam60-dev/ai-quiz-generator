# Render Blueprint — one-click deploy for AI Quiz Generator & Adaptive Learning System
# Docs: https://render.com/docs/blueprint-spec
# After first deploy, update the two TODO lines below with your real onrender.com URLs.

databases:
  - name: quiz-db
    databaseName: quiz_db
    user: quizuser
    plan: free

services:
  # ---- Backend: FastAPI web service ----
  - type: web
    name: ai-quiz-backend
    runtime: python
    runtimeVersion: "3.13"
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a strong random key
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: GEMINI_API_KEY
        sync: false                  # set in Render dashboard (blank = demo mode)
      - key: CORS_ORIGINS
        # TODO: replace with your actual Frontend URL after deploy, e.g.
        #   https://ai-quiz-frontend.onrender.com
        value: http://localhost:5174

  # ---- Frontend: React/Vite static site ----
  - type: web
    name: ai-quiz-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # TODO: replace with your actual Backend URL after deploy, e.g.
        #   https://ai-quiz-backend.onrender.com
        value: http://localhost:8000
